name: esturion

services:
  db:
    image: postgres:16-alpine
    container_name: esturion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: esturion_db
      POSTGRES_USER: esturion
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - esturion_db_data:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez que el volumen está vacío (crea el esquema inicial).
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - esturion_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esturion -d esturion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: esturion-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://esturion:${DB_PASSWORD}@db:5432/esturion_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    ports:
      # Solo accesible desde el propio VPS (127.0.0.1). Nginx en el host hace de puerta de entrada.
      - "127.0.0.1:4000:4000"
    volumes:
      - esturion_uploads:/app/uploads
    networks:
      - esturion_net

networks:
  esturion_net:
    name: esturion_net

volumes:
  esturion_db_data:
    name: esturion_db_data
  esturion_uploads:
    name: esturion_uploads
