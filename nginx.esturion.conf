# /etc/nginx/sites-available/esturion
# Reemplaza tu-dominio.com por tu dominio real antes de usarlo.
# Certbot reescribirá este archivo automáticamente para añadir SSL (ver DEPLOY.md).

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;

    client_max_body_size 6M;   # deja margen sobre el límite de 5MB de subida de imágenes

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
